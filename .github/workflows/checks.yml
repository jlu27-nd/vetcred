name: VetCred checks

on:
  pull_request:
  push:
    branches: [main, 'feat/**']

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      VETCRED_RUN_DB_TESTS: '0'
      VETCRED_RUN_LIVE_E2E: '0'
    steps:
      # Official v6 tag commits verified with git ls-remote on 2026-10-27.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Unit and mocked-provider checks
        run: pnpm test
      - name: Production build
        run: pnpm build
      # Live DB/provider tests run only in a separately trusted, explicitly
      # configured preview environment. No repository secrets enter this job.
